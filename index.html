<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PharmManager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet"/>
<style>
  body{font-family:system-ui,sans-serif;background:#f8f9fa;margin:0}
  select,input{border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;font-size:14px;width:100%;box-sizing:border-box;background:#fff;outline:none}
  select:focus,input:focus{border-color:#1d9e75;box-shadow:0 0 0 2px rgba(29,158,117,.15)}
  button{cursor:pointer;border-radius:8px;font-size:14px;padding:7px 14px;border:1px solid #d1d5db;background:#fff;transition:background .15s}
  .btn-primary{background:#1d9e75!important;color:#fff!important;border-color:#1d9e75!important}
  .btn-primary:hover{background:#178a65!important}
  .btn-danger{background:#fdecea!important;color:#a61c00!important;border-color:#fca5a5!important}
  .btn-success{background:#e6f4ea!important;color:#2d6a4f!important;border-color:#86efac!important}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:8px 10px;font-size:14px}
  thead tr{background:#f3f4f6}
  tbody tr{border-bottom:1px solid #e5e7eb}
  .tab-active{border-bottom:2px solid #1d9e75;color:#111;font-weight:500}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 20px;margin-bottom:14px}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
  .badge-green{background:#e6f4ea;color:#2d6a4f}
  .badge-red{background:#fdecea;color:#a61c00}
  .badge-amber{background:#fff3e0;color:#7c4d00}
  .badge-gray{background:#f3f4f6;color:#6b7280}
  .badge-blue{background:#e3f2fd;color:#0d47a1}
  .metric{background:#f3f4f6;border-radius:8px;padding:16px}
  .metric-label{font-size:13px;color:#6b7280;margin-bottom:4px}
  .metric-value{font-size:22px;font-weight:500}
  .metric-sub{font-size:12px;color:#6b7280;margin-top:2px}
  .warn-box{background:#fdecea;color:#a61c00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
  .field-label{font-size:13px;color:#6b7280;margin-bottom:4px}
  .field{margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback}=React;
const TABS=["Dashboard","Inventory","Orders","Vendors","Price Compare","Profitability"];
const CATS=["All","Antibiotic","Analgesic","Antidiabetic","Statin","Antifungal","Antihistamine","Other"];
const UNITS=["tabs","caps","ml","vials","sachets","bottles","units"];

const initDrugs=[
  {id:1,name:"Amoxicillin 500mg",category:"Antibiotic",stock:120,reorderLevel:50,unit:"caps",sellingPrice:25,expiryDate:"2026-12-01"},
  {id:2,name:"Paracetamol 500mg",category:"Analgesic",stock:30,reorderLevel:100,unit:"tabs",sellingPrice:8,expiryDate:"2027-03-15"},
  {id:3,name:"Metformin 850mg",category:"Antidiabetic",stock:200,reorderLevel:80,unit:"tabs",sellingPrice:15,expiryDate:"2026-08-20"},
  {id:4,name:"Atorvastatin 20mg",category:"Statin",stock:60,reorderLevel:60,unit:"tabs",sellingPrice:35,expiryDate:"2027-01-10"},
];
const initVendors=[
  {id:1,name:"MedSupply Kenya",contact:"0700-111-222",paymentTerms:"30 days",leadDays:3},
  {id:2,name:"Pharma Direct",contact:"0711-333-444",paymentTerms:"15 days",leadDays:5},
  {id:3,name:"HealthCo Distributors",contact:"0722-555-666",paymentTerms:"Cash",leadDays:1},
];
const initPrices=[
  {drugId:1,vendorId:1,price:14,date:"2026-05-01"},{drugId:1,vendorId:2,price:12,date:"2026-05-10"},{drugId:1,vendorId:3,price:16,date:"2026-06-01"},
  {drugId:2,vendorId:1,price:5,date:"2026-05-01"},{drugId:2,vendorId:2,price:4.5,date:"2026-05-15"},{drugId:2,vendorId:3,price:9.5,date:"2026-06-01"},
  {drugId:3,vendorId:1,price:8,date:"2026-05-01"},{drugId:3,vendorId:2,price:7.5,date:"2026-06-01"},
  {drugId:4,vendorId:1,price:20,date:"2026-05-01"},{drugId:4,vendorId:2,price:18,date:"2026-06-01"},{drugId:4,vendorId:3,price:38,date:"2026-06-01"},
];
const initOrders=[
  {id:1,drugId:2,vendorId:1,qty:200,unitPrice:5,status:"Pending",date:"2026-06-10",notes:""},
];

function Badge({color,text}){return <span className={`badge badge-${color}`}>{text}</span>}
function Field({label,children}){return <div className="field"><div className="field-label">{label}</div>{children}</div>}

function App(){
  const [tab,setTab]=useState("Dashboard");
  const [drugs,setDrugs]=useState(initDrugs);
  const [vendors,setVendors]=useState(initVendors);
  const [prices,setPrices]=useState(initPrices);
  const [orders,setOrders]=useState(initOrders);

  const vendorName=id=>vendors.find(v=>v.id===id)?.name||"-";
  const drugName=id=>drugs.find(d=>d.id===id)?.name||"-";
  const lowStock=drugs.filter(d=>d.stock<=d.reorderLevel);
  const pendingDrugIds=new Set(orders.filter(o=>o.status==="Pending").map(o=>o.drugId));

  const bestPrice=useCallback(drugId=>{
    const ps=prices.filter(p=>p.drugId===drugId);
    return ps.length?ps.reduce((a,b)=>a.price<b.price?a:b):null;
  },[prices]);

  const margin=useCallback(drug=>{
    const bp=bestPrice(drug.id);
    return bp?((drug.sellingPrice-bp.price)/drug.sellingPrice*100).toFixed(1):null;
  },[bestPrice]);

  const addDrug=d=>setDrugs(p=>[...p,{...d,id:Date.now()}]);
  const addVendor=v=>setVendors(p=>[...p,{...v,id:Date.now()}]);
  const addPrice=p=>setPrices(pr=>[...pr,p]);
  const addOrder=o=>setOrders(p=>[...p,{...o,id:Date.now()}]);
  const updateOrder=(id,status)=>setOrders(p=>p.map(o=>o.id===id?{...o,status}:o));
  const receiveOrder=o=>{
    setDrugs(p=>p.map(d=>d.id===o.drugId?{...d,stock:d.stock+Number(o.qty)}:d));
    updateOrder(o.id,"Received");
  };

  const shared={drugs,vendors,prices,orders,bestPrice,margin,pendingDrugIds,addDrug,addVendor,addPrice,addOrder,updateOrder,receiveOrder,vendorName,drugName,lowStock};

  return (
    <div style={{minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:"12px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10}}>
        <div style={{width:36,height:36,borderRadius:8,background:"#1d9e75",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>💊</div>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>PharmManager</div>
          <div style={{fontSize:12,color:"#6b7280"}}>Inventory &amp; Procurement</div>
        </div>
        {lowStock.length>0&&<div style={{marginLeft:"auto"}}><Badge color="red" text={`⚠ ${lowStock.length} low stock`}/></div>}
      </div>

      {/* Tabs */}
      <div style={{background:"#fff",borderBottom:"1px solid #e5e7eb",display:"flex",gap:4,padding:"0 16px",overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{padding:"10px 14px",border:"none",background:"none",fontSize:14,color:tab===t?"#111":"#6b7280",whiteSpace:"nowrap"}} className={tab===t?"tab-active":""}>{t}</button>
        ))}
      </div>

      <div style={{padding:"20px 16px",maxWidth:960,margin:"0 auto"}}>
        {tab==="Dashboard"&&<Dashboard {...shared}/>}
        {tab==="Inventory"&&<Inventory {...shared}/>}
        {tab==="Orders"&&<Orders {...shared}/>}
        {tab==="Vendors"&&<VendorTab {...shared}/>}
        {tab==="Price Compare"&&<PriceCompare {...shared}/>}
        {tab==="Profitability"&&<Profitability {...shared}/>}
      </div>
    </div>
  );
}

/* ───── Dashboard ───── */
function Dashboard({drugs,orders,lowStock,bestPrice,margin,vendors}){
  const lossItems=drugs.filter(d=>{const m=margin(d);return m!==null&&parseFloat(m)<0;});
  const ms=drugs.map(d=>margin(d)).filter(Boolean).map(parseFloat);
  const avg=ms.length?(ms.reduce((a,b)=>a+b,0)/ms.length).toFixed(1):"—";
  const pending=orders.filter(o=>o.status==="Pending").length;
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12,marginBottom:20}}>
        <div className="metric"><div className="metric-label">Total Drugs</div><div className="metric-value">{drugs.length}</div></div>
        <div className="metric"><div className="metric-label">Low Stock</div><div className="metric-value" style={{color:lowStock.length>0?"#a61c00":"#2d6a4f"}}>{lowStock.length}</div><div className="metric-sub">need reorder</div></div>
        <div className="metric"><div className="metric-label">Pending Orders</div><div className="metric-value" style={{color:"#7c4d00"}}>{pending}</div></div>
        <div className="metric"><div className="metric-label">Avg Margin</div><div className="metric-value" style={{color:parseFloat(avg)>20?"#2d6a4f":parseFloat(avg)>0?"#7c4d00":"#a61c00"}}>{avg}%</div></div>
        <div className="metric"><div className="metric-label">Loss Items</div><div className="metric-value" style={{color:lossItems.length>0?"#a61c00":"#2d6a4f"}}>{lossItems.length}</div><div className="metric-sub">check pricing</div></div>
      </div>

      {lowStock.length>0&&<div className="card" style={{borderColor:"#fca5a5"}}>
        <div style={{fontWeight:600,color:"#a61c00",marginBottom:10}}>⚠ Low Stock Alert</div>
        {lowStock.map(d=>(
          <div key={d.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f3f4f6",fontSize:14}}>
            <span>{d.name}</span><span style={{color:"#a61c00"}}>{d.stock}/{d.reorderLevel} {d.unit}</span>
          </div>
        ))}
      </div>}

      {lossItems.length>0&&<div className="card" style={{borderColor:"#fca5a5"}}>
        <div style={{fontWeight:600,color:"#a61c00",marginBottom:10}}>💸 Selling at a Loss</div>
        {lossItems.map(d=>{const bp=bestPrice(d.id);return(
          <div key={d.id} style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6,padding:"6px 0",borderBottom:"1px solid #f3f4f6",fontSize:14}}>
            <span>{d.name}</span>
            <span>Buy: KES {bp?.price} → Sell: KES {d.sellingPrice} &nbsp;<Badge color="red" text={margin(d)+"%"}/></span>
          </div>
        );})}
      </div>}

      <div className="card">
        <div style={{fontWeight:600,marginBottom:10}}>Recent Orders</div>
        {orders.length===0&&<div style={{color:"#6b7280",fontSize:14}}>No orders yet.</div>}
        {orders.slice().reverse().slice(0,5).map(o=>(
          <div key={o.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f3f4f6",fontSize:14}}>
            <span>{drugs.find(d=>d.id===o.drugId)?.name}</span>
            <span style={{color:"#6b7280"}}>Qty: {o.qty}</span>
            <Badge color={o.status==="Pending"?"amber":o.status==="Received"?"green":"gray"} text={o.status}/>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ───── Inventory ───── */
function Inventory({drugs,pendingDrugIds,margin,addDrug}){
  const [search,setSearch]=useState("");
  const [cat,setCat]=useState("All");
  const [show,setShow]=useState(false);
  const empty={name:"",category:"Other",stock:"",reorderLevel:"",unit:"tabs",sellingPrice:"",expiryDate:""};
  const [f,setF]=useState(empty);
  const filtered=drugs.filter(d=>(cat==="All"||d.category===cat)&&d.name.toLowerCase().includes(search.toLowerCase()));

  function save(){
    if(!f.name||!f.stock||!f.reorderLevel||!f.sellingPrice)return alert("Fill all required fields.");
    addDrug({...f,stock:Number(f.stock),reorderLevel:Number(f.reorderLevel),sellingPrice:Number(f.sellingPrice)});
    setF(empty);setShow(false);
  }
  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <input placeholder="Search drugs…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:140}}/>
        <select value={cat} onChange={e=>setCat(e.target.value)} style={{width:"auto"}}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        <button className="btn-primary" onClick={()=>setShow(!show)}>+ Add Drug</button>
      </div>

      {show&&<div className="card">
        <div style={{fontWeight:600,marginBottom:12}}>Add New Drug</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
          <Field label="Drug Name *"><input value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))}/></Field>
          <Field label="Category"><select value={f.category} onChange={e=>setF(p=>({...p,category:e.target.value}))}>{CATS.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Current Stock *"><input type="number" value={f.stock} onChange={e=>setF(p=>({...p,stock:e.target.value}))}/></Field>
          <Field label="Reorder Level *"><input type="number" value={f.reorderLevel} onChange={e=>setF(p=>({...p,reorderLevel:e.target.value}))}/></Field>
          <Field label="Unit"><select value={f.unit} onChange={e=>setF(p=>({...p,unit:e.target.value}))}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></Field>
          <Field label="Selling Price KES *"><input type="number" value={f.sellingPrice} onChange={e=>setF(p=>({...p,sellingPrice:e.target.value}))}/></Field>
          <Field label="Expiry Date"><input type="date" value={f.expiryDate} onChange={e=>setF(p=>({...p,expiryDate:e.target.value}))}/></Field>
        </div>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <button className="btn-primary" onClick={save}>Save</button>
          <button onClick={()=>setShow(false)}>Cancel</button>
        </div>
      </div>}

      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr>{["Drug Name","Category","Stock","Reorder At","Sell Price","Margin","Expiry","Status"].map(h=><th key={h} style={{color:"#6b7280",fontSize:12,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map(d=>{
              const m=margin(d);const isLow=d.stock<=d.reorderLevel;const isLoss=m!==null&&parseFloat(m)<0;
              return(
                <tr key={d.id}>
                  <td style={{fontWeight:500}}>{d.name}</td>
                  <td style={{color:"#6b7280"}}>{d.category}</td>
                  <td style={{color:isLow?"#a61c00":"inherit"}}>{d.stock} {d.unit}</td>
                  <td style={{color:"#6b7280"}}>{d.reorderLevel}</td>
                  <td>KES {d.sellingPrice}</td>
                  <td>{m!==null?<Badge color={isLoss?"red":parseFloat(m)>30?"green":"amber"} text={m+"%"}/>:<Badge color="gray" text="No price"/>}</td>
                  <td style={{color:"#6b7280",fontSize:12}}>{d.expiryDate||"—"}</td>
                  <td>{pendingDrugIds.has(d.id)?<Badge color="amber" text="On Order"/>:isLow?<Badge color="red" text="Low Stock"/>:<Badge color="green" text="OK"/>}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {filtered.length===0&&<div style={{color:"#6b7280",padding:"1rem",textAlign:"center"}}>No drugs found.</div>}
      </div>
    </div>
  );
}

/* ───── Orders ───── */
function Orders({drugs,vendors,prices,orders,pendingDrugIds,addOrder,updateOrder,receiveOrder,vendorName,drugName}){
  const [show,setShow]=useState(false);
  const empty={drugId:"",vendorId:"",qty:"",unitPrice:"",notes:""};
  const [f,setF]=useState(empty);
  const [warn,setWarn]=useState("");

  function onDrug(drugId){
    setF(p=>({...p,drugId,vendorId:"",unitPrice:""}));
    setWarn(pendingDrugIds.has(Number(drugId))?"⚠ This drug already has a pending order. Confirm before ordering again.":"");
  }
  function onVendor(vendorId){
    const drug=drugs.find(d=>d.id===Number(f.drugId));
    const pe=prices.find(p=>p.drugId===Number(f.drugId)&&p.vendorId===Number(vendorId));
    setF(p=>({...p,vendorId,unitPrice:pe?pe.price:""}));
    if(drug&&pe&&pe.price>=drug.sellingPrice)setWarn(`💸 Loss alert: vendor price KES ${pe.price} ≥ selling price KES ${drug.sellingPrice}`);
    else if(!pendingDrugIds.has(Number(f.drugId)))setWarn("");
  }
  function place(){
    if(!f.drugId||!f.vendorId||!f.qty||!f.unitPrice)return alert("Fill all fields.");
    addOrder({...f,drugId:Number(f.drugId),vendorId:Number(f.vendorId),qty:Number(f.qty),unitPrice:Number(f.unitPrice),status:"Pending",date:new Date().toISOString().slice(0,10)});
    setF(empty);setWarn("");setShow(false);
  }
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <button className="btn-primary" onClick={()=>setShow(!show)}>+ New Order</button>
      </div>

      {show&&<div className="card">
        <div style={{fontWeight:600,marginBottom:12}}>Create Purchase Order</div>
        {warn&&<div className="warn-box">{warn}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
          <Field label="Drug"><select value={f.drugId} onChange={e=>onDrug(e.target.value)}><option value="">Select drug…</option>{drugs.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
          <Field label="Vendor"><select value={f.vendorId} onChange={e=>onVendor(e.target.value)} disabled={!f.drugId}><option value="">Select vendor…</option>{vendors.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select></Field>
          <Field label="Quantity"><input type="number" value={f.qty} onChange={e=>setF(p=>({...p,qty:e.target.value}))}/></Field>
          <Field label="Unit Price (KES)"><input type="number" step="0.01" value={f.unitPrice} onChange={e=>setF(p=>({...p,unitPrice:e.target.value}))}/></Field>
        </div>
        <Field label="Notes / Negotiation Terms"><input value={f.notes} placeholder="e.g. negotiated 10% discount" onChange={e=>setF(p=>({...p,notes:e.target.value}))}/></Field>
        {f.qty&&f.unitPrice&&<div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>Total: <strong>KES {(f.qty*f.unitPrice).toFixed(0)}</strong></div>}
        <div style={{display:"flex",gap:8}}>
          <button className="btn-primary" onClick={place}>Place Order</button>
          <button onClick={()=>setShow(false)}>Cancel</button>
        </div>
      </div>}

      {orders.length===0&&<div style={{color:"#6b7280",textAlign:"center",padding:"2rem"}}>No orders yet.</div>}
      {orders.slice().reverse().map(o=>(
        <div key={o.id} className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontWeight:600,fontSize:15}}>{drugName(o.drugId)}</div>
              <div style={{fontSize:13,color:"#6b7280"}}>Vendor: {vendorName(o.vendorId)} · {o.date}</div>
              <div style={{fontSize:13,marginTop:2}}>Qty: {o.qty} · KES {o.unitPrice}/unit · <strong>Total: KES {(o.qty*o.unitPrice).toFixed(0)}</strong></div>
              {o.notes&&<div style={{fontSize:12,color:"#6b7280",marginTop:2}}>📝 {o.notes}</div>}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <Badge color={o.status==="Pending"?"amber":o.status==="Received"?"green":"gray"} text={o.status}/>
              {o.status==="Pending"&&<>
                <button className="btn-success" onClick={()=>receiveOrder(o)}>Mark Received</button>
                <button className="btn-danger" onClick={()=>updateOrder(o.id,"Cancelled")}>Cancel</button>
              </>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ───── Vendors ───── */
function VendorTab({vendors,addVendor}){
  const [show,setShow]=useState(false);
  const empty={name:"",contact:"",paymentTerms:"",leadDays:""};
  const [f,setF]=useState(empty);
  function save(){if(!f.name)return;addVendor({...f,leadDays:Number(f.leadDays)||0});setF(empty);setShow(false);}
  return(
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <button className="btn-primary" onClick={()=>setShow(!show)}>+ Add Vendor</button>
      </div>
      {show&&<div className="card">
        <div style={{fontWeight:600,marginBottom:12}}>Add Vendor</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
          <Field label="Vendor Name *"><input value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))}/></Field>
          <Field label="Contact"><input value={f.contact} onChange={e=>setF(p=>({...p,contact:e.target.value}))}/></Field>
          <Field label="Payment Terms"><input value={f.paymentTerms} placeholder="e.g. 30 days, Cash" onChange={e=>setF(p=>({...p,paymentTerms:e.target.value}))}/></Field>
          <Field label="Lead Time (days)"><input type="number" value={f.leadDays} onChange={e=>setF(p=>({...p,leadDays:e.target.value}))}/></Field>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn-primary" onClick={save}>Save</button>
          <button onClick={()=>setShow(false)}>Cancel</button>
        </div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
        {vendors.map(v=>(
          <div key={v.id} className="card" style={{margin:0}}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:6}}>{v.name}</div>
            <div style={{fontSize:13,color:"#6b7280"}}>📞 {v.contact||"—"}</div>
            <div style={{fontSize:13,color:"#6b7280"}}>💳 {v.paymentTerms||"—"}</div>
            <div style={{fontSize:13,color:"#6b7280"}}>🚚 {v.leadDays} day lead time</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ───── Price Compare ───── */
function PriceCompare({drugs,vendors,prices,addPrice}){
  const [selDrug,setSelDrug]=useState("");
  const [show,setShow]=useState(false);
  const [f,setF]=useState({vendorId:"",price:"",date:new Date().toISOString().slice(0,10)});
  const drug=drugs.find(d=>d.id===Number(selDrug));
  const dp=prices.filter(p=>p.drugId===Number(selDrug));
  const minP=dp.length?Math.min(...dp.map(p=>p.price)):null;

  function save(){
    if(!f.vendorId||!f.price)return;
    addPrice({drugId:Number(selDrug),vendorId:Number(f.vendorId),price:Number(f.price),date:f.date});
    setF({vendorId:"",price:"",date:new Date().toISOString().slice(0,10)});setShow(false);
  }
  return(
    <div>
      <div className="card">
        <div style={{fontWeight:600,marginBottom:10}}>Compare Vendor Prices</div>
        <Field label="Select Drug">
          <select value={selDrug} onChange={e=>setSelDrug(e.target.value)}>
            <option value="">Choose a drug…</option>
            {drugs.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </Field>
      </div>

      {selDrug&&drug&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div><span style={{fontWeight:600}}>{drug.name}</span><span style={{color:"#6b7280",fontSize:13,marginLeft:8}}>Selling at KES {drug.sellingPrice}</span></div>
          <button className="btn-primary" style={{fontSize:13,padding:"5px 12px"}} onClick={()=>setShow(!show)}>+ Add Price Quote</button>
        </div>

        {show&&<div className="card">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0 12px"}}>
            <Field label="Vendor"><select value={f.vendorId} onChange={e=>setF(p=>({...p,vendorId:e.target.value}))}><option value="">Select…</option>{vendors.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select></Field>
            <Field label="Price (KES)"><input type="number" step="0.01" value={f.price} onChange={e=>setF(p=>({...p,price:e.target.value}))}/></Field>
            <Field label="Date"><input type="date" value={f.date} onChange={e=>setF(p=>({...p,date:e.target.value}))}/></Field>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn-primary" onClick={save}>Save Quote</button>
            <button onClick={()=>setShow(false)}>Cancel</button>
          </div>
        </div>}

        {dp.length===0&&<div style={{color:"#6b7280",fontSize:14}}>No price quotes yet.</div>}
        {dp.map((p,i)=>{
          const v=vendors.find(v=>v.id===p.vendorId);
          const isBest=p.price===minP;
          const isLoss=p.price>=drug.sellingPrice;
          const m=((drug.sellingPrice-p.price)/drug.sellingPrice*100).toFixed(1);
          const barW=minP?Math.min(100,(minP/p.price)*100):50;
          return(
            <div key={i} className="card" style={{border:isBest?"1.5px solid #1d9e75":undefined}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>
                <div>
                  <span style={{fontWeight:600}}>{v?.name||"Unknown"}</span>
                  {isBest&&<span style={{marginLeft:8,background:"#e6f4ea",color:"#2d6a4f",padding:"2px 8px",borderRadius:10,fontSize:12}}>Best Price</span>}
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontWeight:600,fontSize:16}}>KES {p.price}</span>
                  <Badge color={isLoss?"red":parseFloat(m)>30?"green":"amber"} text={m+(isLoss?"% (LOSS)":"% margin")}/>
                </div>
              </div>
              <div style={{background:"#f3f4f6",borderRadius:4,height:6}}>
                <div style={{width:barW+"%",background:isBest?"#1d9e75":isLoss?"#e24b4a":"#ef9f27",height:6,borderRadius:4}}/>
              </div>
              <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>Quoted: {p.date} · Lead: {v?.leadDays||"?"} days · {v?.paymentTerms||"?"}</div>
            </div>
          );
        })}
      </>}
    </div>
  );
}

/* ───── Profitability ───── */
function Profitability({drugs,prices,vendors,bestPrice,margin}){
  const sorted=[...drugs].map(d=>{
    const bp=bestPrice(d.id);
    const m=margin(d);
    return{...d,bestBuyPrice:bp?.price,bestVendor:bp?vendors.find(v=>v.id===bp.vendorId)?.name:null,margin:m};
  }).sort((a,b)=>(parseFloat(b.margin)||(-999))-(parseFloat(a.margin)||(-999)));

  const profitable=sorted.filter(d=>d.margin!==null&&parseFloat(d.margin)>0);
  const loss=sorted.filter(d=>d.margin!==null&&parseFloat(d.margin)<=0);
  const noPricing=sorted.filter(d=>d.margin===null);

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:12,marginBottom:20}}>
        <div className="metric"><div className="metric-label">Profitable</div><div className="metric-value" style={{color:"#2d6a4f"}}>{profitable.length}</div></div>
        <div className="metric"><div className="metric-label">Loss-making</div><div className="metric-value" style={{color:loss.length>0?"#a61c00":"#2d6a4f"}}>{loss.length}</div></div>
        <div className="metric"><div className="metric-label">No Price Data</div><div className="metric-value" style={{color:"#7c4d00"}}>{noPricing.length}</div></div>
        <div className="metric"><div className="metric-label">Best Margin</div><div className="metric-value" style={{color:"#2d6a4f"}}>{sorted[0]?.margin?sorted[0].margin+"%":"—"}</div><div className="metric-sub">{sorted[0]?.name?.split(" ")[0]}</div></div>
      </div>

      {loss.length>0&&<div className="card" style={{borderColor:"#f09595",marginBottom:14}}>
        <div style={{fontWeight:600,color:"#a61c00",marginBottom:10}}>🚨 Action Needed — Fix Pricing</div>
        {loss.map(d=>(
          <div key={d.id} style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6,padding:"8px 0",borderBottom:"1px solid #f3f4f6",fontSize:14}}>
            <div>
              <div style={{fontWeight:500}}>{d.name}</div>
              <div style={{fontSize:12,color:"#6b7280"}}>Best buy: KES {d.bestBuyPrice} from {d.bestVendor}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div>Sell: KES {d.sellingPrice}</div>
              <Badge color="red" text={d.margin+"% margin"}/>
              <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>Raise to ≥ KES {d.bestBuyPrice?Math.ceil(d.bestBuyPrice*1.2):"?"} for 20% margin</div>
            </div>
          </div>
        ))}
      </div>}

      <div className="card">
        <div style={{fontWeight:600,marginBottom:12}}>All Drugs — Profitability Ranking</div>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr>{["Drug","Sell Price","Best Buy","Best Vendor","Margin","Recommendation"].map(h=><th key={h} style={{color:"#6b7280",fontSize:12,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>
              {sorted.map(d=>{
                const m=d.margin?parseFloat(d.margin):null;
                return(
                  <tr key={d.id}>
                    <td style={{fontWeight:500}}>{d.name}</td>
                    <td>KES {d.sellingPrice}</td>
                    <td>{d.bestBuyPrice?"KES "+d.bestBuyPrice:"—"}</td>
                    <td style={{color:"#6b7280",fontSize:13}}>{d.bestVendor||"—"}</td>
                    <td>{m!==null?<Badge color={m<0?"red":m<20?"amber":"green"} text={d.margin+"%"}/>:<Badge color="gray" text="No data"/>}</td>
                    <td style={{fontSize:12,color:"#6b7280"}}>{m!==null&&m<0?`Raise to KES ${Math.ceil(d.bestBuyPrice*1.2)}`:m!==null&&m<20?"Renegotiate buy price":"✓ Healthy margin"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
